name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: إعداد supabase_config.dart
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "خطأ: SUPABASE_URL و SUPABASE_ANON_KEY غير مضبوطين في GitHub Secrets"
            exit 1
          fi
          cat > lib/config/supabase_config.dart << EOF
          class SupabaseConfig {
            static const String supabaseUrl = '$SUPABASE_URL';
            static const String supabaseAnonKey = '$SUPABASE_ANON_KEY';
          }
          EOF

      - name: تثبيت الاعتماديات
        run: flutter pub get

      - name: إنشاء المنصات
        run: |
          flutter create --project-name warehouse_app --platforms=android .
          rm -f test/widget_test.dart

      - name: تحليل الكود
        id: analyze
        run: |
          flutter analyze 2>&1 | tee flutter_analyze_output.txt
          exit ${PIPESTATUS[0]}

      - name: عرض نتائج التحليل
        if: always() && steps.analyze.outcome == 'failure'
        run: |
          errors=$(cat flutter_analyze_output.txt)
          echo "::error file=analysis.txt,title=flutter analyze::$errors"
          echo "$errors" >> $GITHUB_STEP_SUMMARY

      - name: بناء APK
        run: flutter build apk --debug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk


