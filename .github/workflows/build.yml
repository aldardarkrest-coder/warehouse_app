name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: إعداد supabase_config.dart
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "خطأ: SUPABASE_URL و SUPABASE_ANON_KEY غير مضبوطين في GitHub Secrets"
            exit 1
          fi
          cat > lib/config/supabase_config.dart << EOF
          class SupabaseConfig {
            static const String supabaseUrl = '$SUPABASE_URL';
            static const String supabaseAnonKey = '$SUPABASE_ANON_KEY';
          }
          EOF

      - name: تثبيت الاعتماديات
        run: flutter pub get

      - name: إنشاء المنصات
        run: |
          flutter create --project-name warehouse_app --platforms=android,web .
          rm -f test/widget_test.dart

      - name: تحليل الكود
        run: flutter analyze

      - name: بناء APK
        run: flutter build apk --debug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: بناء Web
        run: flutter build web --base-href=/

      - name: إعداد _worker.js لدعم SPA routing
        run: |
          cat > build/web/_worker.js << 'EOF'
          export default {
            async fetch(request, env) {
              const response = await env.ASSETS.fetch(request);
              if (response.status === 404) {
                return env.ASSETS.fetch(new URL('/index.html', request.url));
              }
              return response;
            }
          }
          EOF

      - name: نشر إلى Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --assets=build/web --name=warehouse-app --compatibility-date=2025-04-01
