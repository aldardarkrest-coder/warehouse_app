name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: إعداد supabase_config.dart
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "خطأ: SUPABASE_URL و SUPABASE_ANON_KEY غير مضبوطين في GitHub Secrets"
            exit 1
          fi
          cat > lib/config/supabase_config.dart << EOF
          class SupabaseConfig {
            static const String supabaseUrl = '$SUPABASE_URL';
            static const String supabaseAnonKey = '$SUPABASE_ANON_KEY';
          }
          EOF

      - name: تثبيت الاعتماديات
        run: flutter pub get

      - name: تشخيص
        run: |
          echo "::notice title=debug::Working directory: $(pwd)"
          echo "::notice title=debug::lib/screens contents:"
          ls -la lib/screens/reports/
          echo "::notice title=debug::File type:"
          file lib/screens/reports/reports_screen.dart
          echo "::notice title=debug::First 3 lines:"
          head -3 lib/screens/reports/reports_screen.dart
          echo "::notice title=debug::Flutter version:"
          flutter --version

      - name: تحليل الكود
        id: analyze
        run: |
          dart analyze lib/screens/reports/reports_screen.dart 2>&1
          flutter analyze 2>&1 | tee flutter_analyze_output.txt
          exit ${PIPESTATUS[0]}

      - name: عرض نتائج التحليل
        if: always() && steps.analyze.outcome == 'failure'
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            printf '::error title=flutter analyze::%s\n' "$line"
          done < flutter_analyze_output.txt

      - name: إنشاء المنصات
        run: |
          flutter create --project-name warehouse_app --platforms=android .
          rm -f test/widget_test.dart

      - name: بناء APK
        run: flutter build apk --debug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk


